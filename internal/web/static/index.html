<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>触觉导览图制版校验工作台</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header><div><span class="eyebrow">TACTILE ATLAS GATE</span><h1>触觉导览图制版校验工作台</h1><p>从规格冻结到母版发布的可追溯校样闭环</p></div><button id="refresh" aria-label="刷新项目">刷新</button></header>
  <main>
    <section class="panel" id="project-form"><h2>新建项目并冻结规格</h2><form id="create-form"><div class="grid"><label>项目 ID<input name="project_id" required pattern="[A-Za-z0-9_-]+"></label><label>项目标题<input name="title" required></label><label>场馆区域<input name="venue_zone" required></label><label>复核员 ID<input name="reviewer_id" required></label><label>成品宽度 (mm)<input name="sheet_width_mm" type="number" value="300" required></label><label>成品高度 (mm)<input name="sheet_height_mm" type="number" value="200" required></label><label>最小触觉间距 (mm)<input name="minimum_gap_mm" type="number" step="0.1" value="3" required></label><label>盲文规范<select name="braille_standard"><option>GB/T 15720</option><option>UEB</option></select></label></div><button type="submit">创建项目</button></form></section>
    <section class="panel"><div class="section-head"><h2>项目状态</h2><select id="project-select"><option value="">选择项目</option></select></div><div id="project-view" class="empty">请选择项目</div></section>
    <section class="panel" id="proof-panel" hidden>
      <div class="section-head"><h2>分区校样编辑</h2><span id="proof-sequence"></span></div>
      <div class="grid compact"><label>制版员 ID<input id="proof-actor" value="maker-1"></label><label>校样 ID<input id="proof-id"></label><label>源稿摘要<input id="source-digest"></label></div>
      <div id="declared-findings" class="selection-strip"></div>
      <div id="proof-sections"></div>
      <div class="action-bar"><button id="proof-preflight">提交预检</button><button id="submit-proof" disabled>确认提交</button><button id="run-validation">执行规则检查</button></div>
      <div id="proof-preflight-result"></div>
    </section>
    <section class="panel" id="detail-panel" hidden><div id="detail"></div></section>
  </main>
  <div id="toast" role="status"></div><script src="/assets/app.js"></script>
</body>
</html>
